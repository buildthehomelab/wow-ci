# Builds ghcr.io/buildthehomelab/wow-ci-tools (tools/Dockerfile).
name: Tools image

on:
  push:
    branches: [main]
    paths:
      - tools/**
  schedule:
    - cron: "41 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t ghcr.io/buildthehomelab/wow-ci-tools:latest tools
          docker run --rm ghcr.io/buildthehomelab/wow-ci-tools:latest sh -c 'clang++ --version | head -1; luac5.1 -v; luacheck --version | head -1'
          docker push ghcr.io/buildthehomelab/wow-ci-tools:latest
