# Reusable on-demand Claude review (see templates/review.yml for the trigger).
name: wow-review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - id: token
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN secret in this repo; skipping the review."
            echo "ok=false" >>"$GITHUB_OUTPUT"
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: buildthehomelab/wow-ci
          path: .wow-ci
      - id: prompt
        if: steps.token.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: |
          {
            echo "text<<PROMPT_EOF"
            echo "REPO: ${{ github.repository }}"
            echo "PR NUMBER: ${{ github.event.pull_request.number }}"
            echo
            cat .wow-ci/config/review-prompt.md
            echo "PROMPT_EOF"
          } >>"$GITHUB_OUTPUT"
      # Label trigger: a full review with inline comments. @claude comments: tag mode.
      - if: steps.token.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
