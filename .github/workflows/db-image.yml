# Builds ghcr.io/buildthehomelab/wow-ci-db, the server-DB snapshot the SQL check runs on.
# Rebuild after the server's core or module pins change (config/core.env,
# config/server-modules.tsv), or weekly to pick up nothing-changed drift.
name: DB snapshot image

on:
  push:
    branches: [main]
    paths:
      - config/core.env
      - config/server-modules.tsv
      - db/**
      - scripts/sqlcheck.py
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: db-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build snapshot
        run: bash db/build.sh
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags ghcr.io/buildthehomelab/wow-ci-db
